name: app_multi_restaurant
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  shared_preferences: ^2.2.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.0.2
  firebase_storage: ^13.4.3
  rename: ^3.1.0
  google_sign_in: ^7.2.0
  provider: ^6.1.2
  intl: ^0.20.2
  google_fonts: ^8.1.0
  google_maps_flutter: ^2.5.3
  geolocator: ^14.0.3
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.2
  http: ^1.1.0
  firebase_app_check: ^0.4.1
  firebase_crashlytics: ^5.2.4
  firebase_performance: ^0.11.4+3
  crypto: ^3.0.3
  timeago: ^3.7.1
  flutter_dotenv: ^6.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  connectivity_plus: ^7.1.1
  lottie: ^3.1.2
  cloud_functions: ^6.3.3
  flutter_stripe: ^13.0.0
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # ── Asset folders ──────────────────────────────────────────────────────────
  # Add your images/icons/lottie files under assets/ then list the subfolder
  # here so Flutter bundles them.  The trailing slash includes all files in
  # that directory; subdirectories need their own entry.
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/lottie/
