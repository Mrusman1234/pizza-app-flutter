<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Multi-Restaurant Pizza Ordering App">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- Mobile meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pizza App">
  <meta name="theme-color" content="#E8401C">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pizza Ordering App</title>
  <link rel="manifest" href="manifest.json">

  <!-- ✅ Google Maps SDK for Web -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDecEs4ql9moIyK9JoLAXsmnCJUAOEhdCA&loading=async" async defer></script>

  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .loader {
      border: 10px solid #f3f3f3;
      border-radius: 50%;
      border-top: 10px solid #E8401C;
      width: 80px;
      height: 80px;
      -webkit-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
    }

    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="loader"></div>
  </div>

  <!-- ✅ Modern Flutter Web (3.22+) initialization -->
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      // 1. Clear any legacy configuration to avoid "simultaneous configuration" errors
      delete window.flutterConfiguration;

      // 2. Load the engine using the modern API
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html",
          }).then(function(appRunner) {
            appRunner.runApp();

            // 3. Smoothly remove the loading indicator
            const loader = document.getElementById('loading');
            if (loader) {
              loader.style.transition = 'opacity 0.4s';
              loader.style.opacity = '0';
              window.setTimeout(function() {
                loader.remove();
              }, 400);
            }
          });
        }
      });
    });
  </script>
</body>
</html>
